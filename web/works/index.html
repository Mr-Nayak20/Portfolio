<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — Shivansh Nayak</title>
  <link rel="stylesheet" href="/site/site.css">
</head>
<body data-page="works">
  <main>
    <section class="works grid" id="works">
      <h1>Works</h1>
      <div class="works-filters">
        <div class="filters-left" id="filters">
          <button type="button" data-filter="All" class="is-active">All</button>
          <button type="button" data-filter="Websites">Websites</button>
          <button type="button" data-filter="Software">Software</button>
          <button type="button" data-filter="AI">AI</button>
          <button type="button" data-filter="Writing">Writing</button>
        </div>
        <div class="filters-right" id="views">
          <button type="button" data-view="grid" class="is-active">Grid</button>
          <button type="button" data-view="list">List</button>
        </div>
      </div>
      <div class="works-values"><span>Index</span><span>Study</span><span>Discipline</span><span>Year</span></div>
      <div class="works-grid" id="work-grid"></div>
      <img class="list-shot" id="list-shot" alt="">
    </section>
  </main>
  <script type="module" src="/site/main.js"></script>
</body>
</html>
